[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devctl"
version = "1.1.0"
description = "Local development orchestrator for Spring Boot, Angular, and Vue.js"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    { name = "Youssef Fellah" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12.3",
    "requests>=2.31.0",
    "jinja2>=3.1.3",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
devctl = "devctl.main:main"

[tool.setuptools.packages.find]
include = ["devctl*"]
exclude = ["samples*", "test*"]

[tool.setuptools.package-data]
devctl = ["templates/**/*.j2"]
